<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Noir — Fragrance</title><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}a{color:inherit}nav{display:flex;align-items:center;justify-content:space-between;padding:24px 6%;border-bottom:1px solid #8884;gap:16px}nav a{font-size:12px;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer;background:var(--accent);color:var(--ink);border:0;padding:14px 24px;border-radius:3px}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}section{padding:65px 6%}h1{font-size:clamp(48px,8vw,112px);line-height:.95;letter-spacing:-.055em;margin:20px 0}h2{font-size:clamp(28px,4vw,52px);letter-spacing:-.04em}p{line-height:1.65;max-width:65ch}small{letter-spacing:.18em;text-transform:uppercase}.hero{min-height:76vh;display:grid;align-items:center;background-size:cover;background-position:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.panel{padding:24px;border:1px solid #8885;background:var(--panel);border-radius:8px}label{display:block;margin:12px 0}input,select{display:block;width:100%;padding:12px;background:var(--panel);color:var(--fg);border:1px solid #8887;border-radius:4px}footer{padding:30px 6%;border-top:1px solid #8884;font-size:13px}dialog{background:var(--panel);color:var(--fg);border:1px solid #8886;padding:30px;width:min(500px,90vw)}dialog::backdrop{background:#000b}@media(max-width:600px){section{padding:40px 5%}nav{padding:18px 5%}} :root{--bg:#100d0a;--fg:#f2e5ce;--accent:#d4a66a;--ink:#171009;--panel:#211a13}h1,h2{font-family:Georgia,serif;font-weight:400}.hero{background-image:linear-gradient(90deg,#100d0af5 0%,#100d0a90 45%,transparent 75%),url('work/atlas-noir.webp');background-position:center 52%}.hero p{max-width:350px}.bottle{height:220px;background:url('work/atlas-noir.webp') center 62%/cover;border-radius:4px}</style><body><nav><a href="index.html#work">← STUDIO</a><strong> A T L A S &nbsp; N O I R </strong><button id="bag">Bag (0)</button></nav><section class="hero"><div><small>Extrait de parfum · Concept collection</small><h1>Born from<br>the earth.</h1><p>Volcanic stone, warm amber and the quiet intensity of the Atlas mountains.</p><button onclick="document.querySelector('#collection').scrollIntoView({behavior:'smooth'})">Discover the collection</button></div></section><section id="collection"><small>01 / The collection</small><h2>Choose your ritual.</h2><div class="grid" id="products"></div></section><dialog id="cart"><h2>Your bag</h2><div id="items"></div><p id="total"></p><button id="checkout">Preview checkout</button> <button onclick="cart.close()">Close</button><p id="notice" role="status"></p></dialog><footer>Independent portfolio concept · Demonstration only · <a href="index.html#work">Back to SIB. Studio</a></footer><script>const products=[['Atlas Noir',95,'Amber · Cedar · Incense'],['Atlas Noir Intense',135,'Oud · Leather · Amber'],['Discovery Set',35,'Three fragrance samples']];let counts=[0,0,0];const $=id=>document.getElementById(id);$('products').innerHTML=products.map((x,i)=>`<article class="panel"><div class="bottle"></div><h3>${x[0]}</h3><p>${x[2]}</p><p>€${x[1]}</p><button onclick="add(${i})">Add to bag</button></article>`).join('');function add(i){counts[i]++;render();$('cart').showModal()}function remove(i){counts[i]=Math.max(0,counts[i]-1);render()}function render(){$('bag').textContent='Bag ('+counts.reduce((a,b)=>a+b,0)+')';$('items').innerHTML=products.map((x,i)=>counts[i]?`<p>${x[0]} × ${counts[i]} <button onclick="remove(${i})">−</button></p>`:'').join('')||'Your bag is empty.';$('total').textContent='Total: €'+products.reduce((a,x,i)=>a+x[1]*counts[i],0);$('notice').textContent=''}$('bag').onclick=()=>{render();$('cart').showModal()};$('checkout').onclick=()=>{$('notice').textContent=counts.some(Boolean)?'Demo checkout ready. No payment is collected.':'Add a fragrance first.'};</script></body></html>
